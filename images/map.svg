<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="map-title">
  <title id="map-title">見本の地図（架空）。〇〇駅からサロンまでの道のりのイラスト</title>
  <rect width="640" height="360" rx="20" fill="#F3E9E1"/>
  <!-- 道 -->
  <path d="M0 200h640" stroke="#FFFFFF" stroke-width="40"/>
  <path d="M200 0v360M440 0v360" stroke="#FFFFFF" stroke-width="30"/>
  <path d="M0 200h640M200 0v360M440 0v360" stroke="#D9B8A8" stroke-width="1.2" stroke-dasharray="10 10"/>
  <!-- 駅 -->
  <rect x="40" y="230" width="130" height="70" rx="14" fill="#FFFFFF" stroke="#3B322E" stroke-width="1.4"/>
  <text x="105" y="272" text-anchor="middle" font-size="20" font-weight="600" fill="#3B322E" font-family="Shippori Mincho, serif">〇〇駅</text>
  <!-- 徒歩の道順 -->
  <path d="M170 240c40-10 70-30 100-40h150" fill="none" stroke="#3B322E" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 12"/>
  <!-- 目印 -->
  <rect x="250" y="110" width="80" height="60" rx="10" fill="#FFFFFF" stroke="#3B322E" stroke-width="1.2"/>
  <text x="290" y="146" text-anchor="middle" font-size="15" fill="#3B322E" font-family="Shippori Mincho, serif">公園</text>
  <rect x="470" y="230" width="100" height="60" rx="10" fill="#FFFFFF" stroke="#3B322E" stroke-width="1.2"/>
  <text x="520" y="266" text-anchor="middle" font-size="15" fill="#3B322E" font-family="Shippori Mincho, serif">コンビニ</text>
  <!-- サロンの印 -->
  <path d="M420 150c0-20 16-34 34-34s34 14 34 34c0 24-34 52-34 52s-34-28-34-52z" fill="#D9B8A8" stroke="#3B322E" stroke-width="1.4"/>
  <circle cx="454" cy="150" r="12" fill="#FFFFFF"/>
  <text x="454" y="90" text-anchor="middle" font-size="18" font-weight="600" fill="#3B322E" font-family="Shippori Mincho, serif">Sunday Tea</text>
  <!-- 注記 -->
  <rect x="20" y="20" width="200" height="34" rx="17" fill="#3B322E"/>
  <text x="120" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF" font-family="Shippori Mincho, serif">見本の地図です（架空）</text>
</svg>
